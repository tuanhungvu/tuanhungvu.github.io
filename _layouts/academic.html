{%- assign p = site.data.profile -%}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ p.name }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="{{ p.name }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ p.name }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ p.photo | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231d4ed8'/><text x='50%25' y='54%25' font-family='Georgia,serif' font-size='30' fill='white' text-anchor='middle' dominant-baseline='middle'>TH</text></svg>">
  <script>
    (function () {
      try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": {{ p.name | jsonify }},
    "jobTitle": {{ p.positions[0].role | jsonify }},
    "worksFor": {{ p.positions[0].org | jsonify }},
    "url": {{ site.url | jsonify }},
    "image": {{ p.photo | absolute_url | jsonify }},
    "sameAs": [{% for l in p.links %}{% unless l.label == "CV" %}{{ l.url | jsonify }}{% unless forloop.last %},{% endunless %}{% endunless %}{% endfor %}]
  }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ p.name }}</a>
      <nav class="nav" aria-label="Sections">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#news' | relative_url }}">News</a>
        <a href="{{ '/#publications' | relative_url }}">Publications</a>
        <a href="{{ '/#service' | relative_url }}">Service</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <i class="fa-solid fa-moon" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>© {{ site.time | date: "%Y" }} {{ p.name }}</span>
      <span>Last updated {{ site.time | date: "%B %Y" }}</span>
    </div>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
